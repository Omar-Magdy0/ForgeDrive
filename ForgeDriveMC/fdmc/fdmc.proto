syntax = "proto3";
package fdmc.v1;

import "fdrpc.proto";

enum Direction {
  Direction_Forward = 0;
  Direction_Backward = 1;
}

enum MechMode {
  MechMode_Unspecified = 0;
  MechMode_Torque = 1;
  MechMode_Speed = 2;
  MechMode_Position = 3;
}

enum PidType {
  PidType_CD = 0;
  PidType_CQ = 1;
  PidType_Speed = 2;
  PidType_Position = 3;
}

enum McMode {
  McMode_Unspecified = 0;
  McMode_Idle = 1;
  McMode_Fault = 2;
  McMode_Foc = 3;
  McMode_Scomm = 4;
}

enum ElecMode {
  ElecMode_Voltage = 0;
  ElecMode_Current = 1;
}

enum StopMode {
  StopMode_Coast = 0;
  StopMode_Ramp = 1;
  StopMode_EmergencyPlug = 2;
}

enum PmsmFault {
  PmsmFault_Ok = 0;
  PmsmFault_Uvlo = 1;
  PmsmFault_Ovlo = 2;
  PmsmFault_Overload = 4;
  PmsmFault_CurrentSense = 8;
  PmsmFault_Overtemp = 16;
  PmsmFault_Overcurrent = 32;
}

enum PmsmErr {
  PmsmErr_Ok = 0;
  PmsmErr_Unkown = 1;
  PmsmErr_NotInitialized = 2;
  PmsmErr_NotImplemented = 3;
  PmsmErr_ConfigNotAllowed = 64;
  PmsmErr_ConfigBad = 65;
}

enum IdStage {
  IdStage_Idle = 0;
  IdStage_Res = 1;
  IdStage_IndD = 2;
  IdStage_Rest0 = 3;
  IdStage_IndQ = 4;
}

enum IdSubStage {
  IdSubStage_SettleStart = 0;
  IdSubStage_SettleWait = 1;
  IdSubStage_ActiveSampling = 2;
}

// Profile
message ProfilePoint2D {
  float time = 1;
  float v1 = 2;
  float v2 = 3;
}

// PWM configuration
message ConfigPwm {
  uint32 pwm_hz = 1;
  uint32 deadtime_ns = 2;
  float minDuty = 3;
  float maxDuty = 4;
  float dtcThresh = 5;
  bool dtcActive = 6;
}

message ElecSensorConfig {
  float offset = 1;
  float gain = 2;
}

// Analog configuration
message ConfigAnalog {
  ElecSensorConfig vsBus = 1;
  ElecSensorConfig vsU = 2;
  ElecSensorConfig vsV = 3;
  ElecSensorConfig vsW = 4;
  ElecSensorConfig csU_csBus = 5;
  ElecSensorConfig csV = 6;
  ElecSensorConfig csW = 7;
  bool offsetCalib = 8;
}

// Serial communication configuration
message ConfigScomm {
  uint32 oversampleBits = 1;
  uint32 minSettleTicks = 2;
  uint32 hfiN = 3;
  float dcVinj = 4;
  float hfiVinj = 5;
}

// PMSM model
message PmsmModel {
  float res_ohm = 1;
  float indD_h = 2;
  float indQ_h = 3;
  float flux_wb = 4;
  float inertia_kgm2 = 5;
  float friction_nms = 6;
  uint32 polePairs = 7;
}

// General configuration
message ConfigGen {
  uint32 maxPwm_hz = 1;
  uint32 minPwm_hz = 2;
  uint32 maxDeadtime_ns = 3;
  uint32 minDeadtime_ns = 4;
  float maxCMag = 5;
  float minVBus = 6;
  float maxVBus = 7;
  uint32 xtick_hz = 8;
  uint32 posRate = 9;
}

// PID controller
message Pid {
  float kp = 1;
  float ki = 2;
  float kd = 3;
  PidType type = 4;
}

message Setpoint {
  float val = 1;
  MechMode mechMode = 2; // Defaults to MechMode_UNSPECIFIED (0) in proto3
}

message ControlMode {
  McMode mcMode = 1;
  MechMode mechMode = 2;
}

message GetPidArg {
  PidType n = 1;
}

message PmsmFaultRet {
  uint32 fault = 1;
}

message PmsmErrRet {
  PmsmErr err = 1;
}

message Empty {}

service Fdmc {
  // Setpoint
  rpc SetSetpoint(Setpoint) returns (PmsmErrRet) {
    option (fdrpc.id) = 2;
  }
  rpc GetSetpoint(Empty) returns (Setpoint) {
    option (fdrpc.id) = 3;
  }

  // Motor model
  rpc SetModel(PmsmModel) returns (PmsmErrRet) {
    option (fdrpc.id) = 4;
  }
  rpc GetModel(Empty) returns (PmsmModel) {
    option (fdrpc.id) = 5;
  }

  // Control mode
  rpc SetControlMode(ControlMode) returns (PmsmErrRet) {
    option (fdrpc.id) = 6;
  }
  rpc GetControlMode(Empty) returns (ControlMode) {
    option (fdrpc.id) = 7;
  }

  // PWM configuration
  rpc SetConfigPwm(ConfigPwm) returns (PmsmErrRet) {
    option (fdrpc.id) = 8;
  }
  rpc GetConfigPwm(Empty) returns (ConfigPwm) {
    option (fdrpc.id) = 9;
  }

  // Analog configuration
  rpc SetConfigAnalog(ConfigAnalog) returns (PmsmErrRet) {
    option (fdrpc.id) = 10;
  }
  rpc GetConfigAnalog(Empty) returns (ConfigAnalog) {
    option (fdrpc.id) = 11;
  }

  // PID configuration
  rpc SetPid(Pid) returns (PmsmErrRet) {
    option (fdrpc.id) = 12;
  }
  rpc GetPid(GetPidArg) returns (Pid) {
    option (fdrpc.id) = 13;
  }

  // Self-commissioning configuration
  rpc SetConfigScomm(ConfigScomm) returns (PmsmErrRet) {
    option (fdrpc.id) = 14;
  }
  rpc GetConfigScomm(Empty) returns (ConfigScomm) {
    option (fdrpc.id) = 15;
  }

  // Fault management
  rpc ClearFault(Empty) returns (PmsmErrRet) {
    option (fdrpc.id) = 16;
  }
  rpc GetFault(Empty) returns (PmsmFaultRet) {
    option (fdrpc.id) = 17;
  }
}
