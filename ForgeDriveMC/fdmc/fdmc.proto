syntax = "proto3";
package fdmc.v1;

import "fdrpc.proto";

enum Direction {
  Direction_FORWARD = 0;
  Direction_BACKWARD = 1;
}

enum MechMode {
  MechMode_UNSPECIFIED = 0;
  MechMode_TORQUE = 1;
  MechMode_SPEED = 2;
  MechMode_POSITION = 3;
}

enum PidType {
  PidType_ID = 0;
  PidType_IQ = 1;
  PidType_SPEED = 2;
  PidType_POSITION = 3;
}

enum McMode {
  McMode_UNSPECIFIED = 0;
  McMode_IDLE = 1;
  McMode_FAULT = 2;
  McMode_FOC = 3;
  McMode_SCOMM = 4;
}

enum ElecMode {
  ElecMode_VOLTAGE = 0;
  ElecMode_CURRENT = 1;
}

enum StopMode {
  StopMode_COAST = 0;
  StopMode_RAMP = 1;
  StopMode_EMERGENCY_PLUG = 2;
}

enum PmsmFault {
  PmsmFault_OK = 0;
  PmsmFault_UVLO = 1;
  PmsmFault_OVLO = 2;
  PmsmFault_OLOAD = 4;
  PmsmFault_CSFAULT = 8;
  PmsmFault_OT = 16;
  PmsmFault_OC = 32;
}

enum PmsmErr {
  PmsmErr_OK = 0;
  PmsmErr_UNKNOWN_ERROR = 1;
  PmsmErr_NOT_INITIALIZED = 2;
  PmsmErr_NOT_IMPLEMENTED = 3;
  PmsmErr_CONFIG_NOT_ALLOWED_MOTOR_RUNNING = 64;
  PmsmErr_CONFIG_BAD = 65;
}

enum IdStage {
  IdStage_IDLE = 0;
  IdStage_RS_ID = 1;
  IdStage_LD_ID = 2;
  IdStage_REST0 = 3;
  IdStage_LQ_ID = 4;
}

enum IdSubStage {
  IdSubStage_ESETTLE_START = 0;
  IdSubStage_ESETTLE_WAIT = 1;
  IdSubStage_ACTIVE_SAMPLING = 2;
}

// Profile
message ProfilePoint2D {
  float t = 1;
  float v1 = 2;
  float v2 = 3;
}

// PWM configuration
message ConfigPwm {
  uint32 pwm_hz = 1;
  uint32 deadtime_ns = 2;
  float duty_min = 3;
  float duty_max = 4;
}

message ElecSensorConfig {
  float offset = 2;
  float gain = 3;
}

// Analog configuration
message ConfigAnalog {
  ElecSensorConfig vsbus = 1;
  ElecSensorConfig vsu = 2;
  ElecSensorConfig vsv = 3;
  ElecSensorConfig vsw = 4;
  ElecSensorConfig csu_csbus = 5;
  ElecSensorConfig csv = 6;
  ElecSensorConfig csw = 7;
  bool offset_calibration = 8;
}

// Serial communication configuration
message ConfigSComm {
  uint32 oversample_bits = 1;
  uint32 esettle_min_ticks = 2;
  uint32 hfi_n = 3;
  float dc_vinj = 4;
  float hfi_vinj = 5;
}

// PMSM model
message PmsmModel {
  float R = 1;
  float Ld = 2;
  float Lq = 3;
  float psi = 4;
  float J = 5;
  float B = 6;
  uint32 pole_pairs = 7;
}

// General configuration
message ConfigGen {
  uint32 max_freq = 1;
  uint32 min_freq = 2;
  uint32 max_deadtime_ns = 3;
  uint32 min_deadtime_ns = 4;
  float max_cmag = 5;
  float min_vbus = 6;
  float max_vbus = 7;
  uint32 xtick_freq = 8;
  uint32 pos_rate_div = 9;
}

// PID controller
message Pid {
  float Kp = 1;
  float Ki = 2;
  float Kd = 3;
  PidType type = 4;
}

message Setpoint {
  float sp = 1;
  MechMode mech_mode = 2; // Defaults to MechMode_UNSPECIFIED (0) in proto3
}

message ControlMode {
  McMode mc_mode = 1;
  MechMode mech_mode = 2;
}

message GetPidArg {
  PidType n = 1;
}

message PmsmFaultRet {
  uint32 fault = 1;
}

message PmsmErrRet {
  PmsmErr err = 1;
}

message Empty {}

service Fdmc {
  rpc SetSetpoint(Setpoint) returns (PmsmErrRet) {
    option (fdrpc.id) = 1;
  }
  rpc SetModel(PmsmModel) returns (PmsmErrRet) {
    option (fdrpc.id) = 2;
  }
  rpc SetControlMode(ControlMode) returns (PmsmErrRet) {
    option (fdrpc.id) = 3;
  }
  rpc SetConfigPwm(ConfigPwm) returns (PmsmErrRet) {
    option (fdrpc.id) = 4;
  }
  rpc SetConfigAnalog(ConfigAnalog) returns (PmsmErrRet) {
    option (fdrpc.id) = 5;
  }
  rpc SetPid(Pid) returns (PmsmErrRet) {
    option (fdrpc.id) = 6;
  }
  rpc SetConfigSComm(ConfigSComm) returns (PmsmErrRet) {
    option (fdrpc.id) = 7;
  }
  rpc ClearFault(Empty) returns (PmsmErrRet) {
    option (fdrpc.id) = 12;
  }

  rpc GetControlMode(Empty) returns (ControlMode) {
    option (fdrpc.id) = 8;
  }
  rpc GetModel(Empty) returns (PmsmModel) {
    option (fdrpc.id) = 9;
  }
  rpc GetPid(GetPidArg) returns (Pid) {
    option (fdrpc.id) = 10;
  }
  rpc GetFault(Empty) returns (PmsmFaultRet) {
    option (fdrpc.id) = 11;
  }
}
